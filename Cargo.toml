[package]
name = "angles"
version = "0.13.0"
edition = "2021"

[dependencies]
bevy = { version = "0.16.1", features = ["wav", "jpeg"] }
resvg = "0.45"
ureq = { version = "2", features = ["json"] }
serde_json = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
